version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docemomento_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docemomento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: doce-momento-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/docemomento?schema=public
    depends_on:
      - postgres

volumes:
  postgres_data: