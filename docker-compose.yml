# ============================================
# DOCE MOMENTO - Docker Compose
# ============================================

version: '3.8'

services:
  app:
    build: .
    container_name: doce-momento-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    restart: unless-stopped
    command: yarn dev