
name: CI - Doce Momento

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  linter:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --runInBand

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir aplicação
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
